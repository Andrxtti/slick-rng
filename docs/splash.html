<style>
/* ---- app shell: intro splash + phone fit (standalone app only) */
header.top { top: 0; padding-top: env(safe-area-inset-top, 0px); }
body { padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px)); }
button, .cell, .seat, .slot { touch-action: manipulation; }
@media (pointer: coarse) { input, select { font-size: 16px; } }
#splash { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 14px; cursor: pointer;
  background: radial-gradient(60% 45% at 50% 42%, #1b1913 0%, #090908 70%); color: #f3ecdc;
  padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px); transition: opacity .45s ease, visibility .45s; }
#splash.out { opacity: 0; visibility: hidden; }
.sp-chip { width: min(58vw, 250px); aspect-ratio: 1; position: relative; animation: sp-pop .55s cubic-bezier(.2, 1.4, .4, 1) both; }
.sp-chip { border-radius: 50%; }
.sp-face { width: 100%; height: 100%; display: block; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 5px #efe4c8, 0 0 0 9px #5aa9de, 0 24px 50px -10px rgba(0, 0, 0, .9); }
.dwi { position: absolute; left: 22.5%; top: 38.55%; width: 27.09%; image-rendering: pixelated; animation: dwi-drop .9s steps(9, end) .7s both; }
@keyframes dwi-drop { from { transform: translateY(-260%); opacity: 0; } 12% { opacity: 1; } to { transform: none; opacity: 1; } }
.sp-chip::after { content: ""; position: absolute; inset: -18%; border-radius: 50%; background: radial-gradient(circle, rgba(90, 169, 222, .28), transparent 62%); z-index: -1; animation: sp-glow 2.4s ease-in-out .8s infinite; }
.sp-word { font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; font-weight: 700; font-size: clamp(30px, 9vw, 56px); letter-spacing: .08em; text-align: center; line-height: 1; margin-top: 10px;
  animation: sp-rise .6s cubic-bezier(.2, .8, .2, 1) 1.35s both; }
.sp-word span { color: #5aa9de; }
.sp-tag { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: #b0a690; animation: sp-rise .6s cubic-bezier(.2, .8, .2, 1) 1.55s both; }
.sp-bar { width: 140px; height: 3px; border-radius: 3px; background: #1d1b16; overflow: hidden; margin-top: 18px; animation: sp-rise .5s ease 1.6s both; }
.sp-bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #5aa9de, #efe4c8); transform-origin: left; animation: sp-load 1s cubic-bezier(.5, 0, .2, 1) 1.6s both; }
.sp-foot { position: absolute; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 11px; color: #6c6457; letter-spacing: .06em; animation: sp-rise .6s ease 1s both; }
@keyframes sp-pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@keyframes sp-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes sp-load { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes sp-glow { 50% { opacity: .45; transform: scale(1.06); } }
@media (prefers-reduced-motion: reduce) { #splash *, #splash *::after { animation: none !important; } }
</style>
<div id="splash" aria-hidden="true">
  <div class="sp-chip"><img class="sp-face" src="icons/slick-badge.jpg" alt=""><img class="dwi" src="icons/dwi.png" alt=""></div>
  <div class="sp-word">CONFIRMED <span>FIRE</span> POKER</div>
  <div class="sp-tag">Slick RNG Solver</div>
  <div class="sp-bar"><i></i></div>
  <div class="sp-foot">Free forever · built by players</div>
</div>
<script>
(() => {
  const sp = document.getElementById('splash');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let gone = false;
  const hide = () => { if (gone) return; gone = true; sp.classList.add('out'); setTimeout(() => sp.remove(), 500); };
  sp.addEventListener('click', hide);
  setTimeout(hide, reduced ? 700 : 2900);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
