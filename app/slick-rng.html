<title>Slick RNG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column study flow — format bar, preflop line, board, then the strategy browser. Single dark card-room look. */
:root {
  color-scheme: dark;
  --bg: #0d1214;
  --panel: #141b1e;
  --panel-2: #1a2327;
  --line: #26333a;
  --fg: #e6ece9;
  --muted: #8a9a97;
  --faint: #5a6b68;
  --brass: #d6a649;
  --brass-ink: #1b1406;
  --danger: #e2685a;
  --a-fold: #4f7590;
  --a-pass: #3fa56b;
  --a-allin: #7b2443;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 6px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 14px; line-height: 1.45; padding-inline: 16px; padding-block: 0 40px; max-width: 1280px; margin-inline: auto; }
button, input, select { font: inherit; color: inherit; }
select { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 8px; min-width: 0; }
input[type="range"] { accent-color: var(--brass); }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
button { cursor: pointer; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel-2); padding: 7px 12px; }
button:hover:not(:disabled) { border-color: var(--faint); }
button.primary { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); font-weight: 600; }
button:disabled { opacity: .4; cursor: default; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: .03em; margin: 0; }

header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 14px; }
.wordmark { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: .04em; line-height: 1; }
.wordmark span { color: var(--brass); }
.ver { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--brass); color: var(--brass); padding: 2px 6px; border-radius: 3px; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--panel-2); }
.seg button { border: 0; border-radius: 0; background: transparent; padding: 7px 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); font-weight: 600; }

.bar { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 12px; margin-bottom: 12px; }

/* preflop seats */
.seats { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; }
@media (max-width: 700px) { .seats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.seat { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 8px 6px; text-align: center; display: grid; gap: 2px; min-width: 0; }
.seat b { font-family: var(--font-display); font-size: 17px; letter-spacing: .03em; font-weight: 600; }
.seat small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat.fold { opacity: .38; }
.seat.agg small { color: #e88a55; font-weight: 600; }
.seat.pass small { color: #5cc285; font-weight: 600; }
.seat.now { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass) inset; }
.seat.now small { color: var(--brass); }
.prompt { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.prompt .who { font-family: var(--font-display); font-size: 19px; font-weight: 600; }
.prompt button { min-width: 84px; font-weight: 500; }
.prompt .b-fold { color: #9cb6c9; }
.prompt .b-pass { color: #6fd39a; }
.prompt .b-agg { color: #f0a06e; }

/* board */
.board { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.slot { width: 46px; height: 62px; border-radius: 6px; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 600; font-size: 18px; line-height: 1; padding: 0; }
.slot.filled { background: #eef1ef; color: #111; border-color: #eef1ef; }
.slot.empty { background: transparent; border: 1px dashed var(--faint); color: var(--faint); font-size: 12px; font-weight: 400; }
.slot.s-h { color: #b2281a; } .slot.s-d { color: #1b4f8f; } .slot.s-c { color: #16683a; }
.slot.active { outline: 2px solid var(--brass); outline-offset: 2px; }
.sep { width: 1px; align-self: stretch; background: var(--line); margin-inline: 4px; }
.picker { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 3px; }
.card { aspect-ratio: 3 / 4; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); font-family: var(--font-mono); font-size: 12px; display: grid; place-items: center; padding: 0; line-height: 1; max-width: 100%; }
.card.s-c { color: #6fc08a; } .card.s-d { color: #69a8e8; } .card.s-h { color: #ee7a6b; } .card.s-s { color: #c9d1cf; }
.card:disabled { opacity: .15; }

.solverow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.meter { height: 4px; background: var(--bg); border-radius: 2px; overflow: hidden; flex: 1; min-width: 120px; }
.meter i { display: block; height: 100%; width: 0; background: var(--brass); transition: width .25s linear; }
.status { font-size: 12px; color: var(--muted); }
.error { color: var(--danger); font-size: 13px; }
details.adv summary { cursor: pointer; color: var(--muted); font-size: 13px; width: max-content; }
.advgrid { display: grid; grid-template-columns: 56px repeat(2, minmax(0, 1fr)); gap: 6px; align-items: center; margin-top: 8px; max-width: 520px; }
.advgrid input { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 5px 8px; font-family: var(--font-mono); font-size: 12px; width: 100%; min-width: 0; }

/* in-hand players */
.inhand { display: flex; gap: 6px; flex-wrap: wrap; }
.pchip { display: inline-flex; align-items: center; gap: 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13px; }
.pchip b { font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: .03em; }
.pchip button { padding: 2px 9px; font-size: 12px; border-radius: 999px; }

/* results */
.results { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.res-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.evs { display: flex; gap: 6px; flex-wrap: wrap; }
.ev { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; font-size: 12px; }
.ev b { font-family: var(--font-mono); font-weight: 500; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.crumb { font-size: 12px; padding: 3px 8px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); }
.crumb.cardcrumb { font-family: var(--font-mono); font-weight: 600; }
.arrow { color: var(--faint); font-size: 11px; }
.node { padding: 14px; display: grid; gap: 12px; }
.nodetitle { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.nodetitle h2 { font-size: 26px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.act { display: grid; grid-template-columns: 10px auto; column-gap: 8px; align-items: center; text-align: left; padding: 8px 12px; }
.act i { width: 10px; height: 10px; border-radius: 2px; grid-row: span 2; }
.act strong { font-weight: 600; font-size: 14px; }
.act small { font-family: var(--font-mono); color: var(--muted); font-size: 12px; }
.freqbar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; background: var(--bg); }
.freqbar i { display: block; height: 100%; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 280px); gap: 14px; align-items: start; }
@media (max-width: 1000px) { .split { grid-template-columns: minmax(0, 1fr); } }
.gridwrap { overflow-x: auto; }
.hgrid { display: grid; grid-template-columns: repeat(13, minmax(26px, 1fr)); gap: 2px; min-width: 360px; }
.cell { position: relative; aspect-ratio: 1; border-radius: 3px; overflow: hidden; background: #0a0e10; border: 0; padding: 0; cursor: pointer; }
.cell .mix { position: absolute; inset: 0; display: flex; }
.cell .mix i { display: block; height: 100%; }
.cell .fill { position: absolute; left: 0; right: 0; top: 0; background: #0a0e10; }
.cell .lab { position: absolute; left: 3px; top: 2px; font-family: var(--font-mono); font-size: 10px; font-weight: 500; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; }
.cell.none .lab { color: var(--faint); text-shadow: none; }
.cell.sel { outline: 2px solid var(--brass); outline-offset: -2px; }
.detail { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
.detail table { width: 100%; border-collapse: collapse; font-size: 12px; }
.detail td, .detail th { padding: 3px 4px; text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.detail th { font-family: var(--font-body); font-weight: 500; font-size: 11px; }
.detail td:first-child, .detail th:first-child { text-align: left; }
.empty-state { padding: 40px 14px; text-align: center; color: var(--muted); }

/* modals */
.modal { position: fixed; inset: 0; background: rgba(5, 8, 9, .8); display: grid; place-items: center; padding: 16px; z-index: 50; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; width: min(640px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 12px; }
.rgrid { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 2px; user-select: none; touch-action: none; }
.rcell { aspect-ratio: 1; border-radius: 3px; font-family: var(--font-mono); font-size: 10px; display: grid; place-items: center; background: #0a0e10; color: var(--muted); position: relative; overflow: hidden; }
.rcell .w { position: absolute; left: 0; right: 0; bottom: 0; background: var(--brass); opacity: .85; }
.rcell span { position: relative; }
.rcell.on span { color: var(--brass-ink); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }
</style>

<header class="top">
  <div class="wordmark">SLICK <span>RNG</span></div>
  <span class="ver">ALPHA 1.1</span>
</header>

<div class="bar">
  <div class="row">
    <div class="seg" role="group" aria-label="Game"><button data-game="cash" aria-pressed="true">Cash</button><button data-game="mtt" aria-pressed="false">MTT</button><button data-game="icm" aria-pressed="false">MTT · ICM</button></div>
    <div class="seg" role="group" aria-label="Table size"><button data-table="6" aria-pressed="false">6-max</button><button data-table="9" aria-pressed="true">9-max</button></div>

    <label class="row" id="leftWrap" hidden><span class="label">Players left</span><select id="left" aria-label="Players left in tournament"></select></label>
  </div>
  <div class="seats" id="seats"></div>
  <div class="prompt" id="prompt"></div>
</div>

<div class="bar">
  <div class="board">
    <span class="label">Board</span>
    <div class="row" id="slots"></div>
    <button id="randomFlop">Random flop</button>
    <span class="sep"></span>
    <label class="row"><span class="label">Sizes</span>
      <select id="sizing"><option value="simple">Simple</option><option value="standard">Standard</option><option value="complex">Complex</option></select></label>
    <label class="row"><span class="label">Depth</span>
      <select id="depth"><option value="20">Quick · 20s</option><option value="60" selected>Normal · 1 min</option><option value="180">Deep · 3 min</option><option value="600">Overnight-lite · 10 min</option></select></label>
    <div class="grow"></div>
    <button id="stopBtn" hidden>Stop</button>
    <button id="solveBtn" class="primary">Solve</button>
  </div>
  <div class="picker" id="picker" hidden></div>
  <div class="solverow"><div class="meter"><i id="meter"></i></div><span class="status mono" id="status">Ready</span></div>
  <div class="error" id="err" role="alert"></div>
  <details class="adv">
    <summary>Custom bet sizes</summary>
    <div class="advgrid">
      <span></span><span class="label">Bets</span><span class="label">Raises</span>
      <span class="label">Flop</span><input id="fb" aria-label="Flop bets"><input id="fr" aria-label="Flop raises">
      <span class="label">Turn</span><input id="tb" aria-label="Turn bets"><input id="tr" aria-label="Turn raises">
      <span class="label">River</span><input id="rb" aria-label="River bets"><input id="rr" aria-label="River raises">
    </div>
  </details>
</div>

<div class="results">
  <div class="res-head">
    <div class="inhand grow" id="inhand"></div>
    <div class="evs" id="evs"></div>
  </div>
  <div class="crumbs" id="crumbs"></div>
  <div id="nodeView"><div class="empty-state">Set the preflop action, then press Solve.</div></div>
</div>

<div class="modal" id="rangeModal" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="rmTitle">
    <div class="row"><h2 id="rmTitle" class="grow">Range</h2><span id="rmCount" class="mono muted"></span></div>
    <label class="row"><span class="label">Paint weight</span><input id="rmWeight" type="range" min="0" max="100" value="100" class="grow"><span id="rmWeightVal" class="mono" style="width:44px">100%</span></label>
    <div class="rgrid" id="rmGrid"></div>
    <div class="row"><button id="rmReset">Default</button><button id="rmClear">Clear</button><div class="grow"></div><button id="rmCancel">Cancel</button><button id="rmDone" class="primary">Use range</button></div>
  </div>
</div>

<script type="text/plain" id="engine-src">// Slick RNG engine (JavaScript port of the Rust engine).
// Multiway Monte Carlo CFR: external sampling, regret-matching+, quadratic averaging.
// Runs inside a Web Worker (browser) or under Node for tests.
'use strict';

// ---------------------------------------------------------------- cards
const RANKS = '23456789TJQKA', SUITS = 'cdhs';
const NUM_COMBOS = 1326;
const COMBO_A = new Uint8Array(NUM_COMBOS), COMBO_B = new Uint8Array(NUM_COMBOS);
(function () { let i = 0; for (let a = 0; a < 52; a++) for (let b = 0; b < a; b++) { COMBO_A[i] = a; COMBO_B[i] = b; i++; } })();
function comboIndex(a, b) { if (a < b) { const t = a; a = b; b = t; } return (a * (a - 1)) / 2 + b; }
function parseCard(s) {
  const r = RANKS.indexOf(s[0].toUpperCase()), su = SUITS.indexOf(s[1].toLowerCase());
  if (r < 0 || su < 0 || s.length !== 2) throw new Error(`bad card "${s}"`);
  return r * 4 + su;
}
function parseCards(s) {
  const t = s.replace(/[\s,]/g, '');
  if (t.length % 2) throw new Error(`bad board "${s}"`);
  const out = [];
  for (let i = 0; i < t.length; i += 2) { const c = parseCard(t.slice(i, i + 2)); if (out.includes(c)) throw new Error('duplicate card on board'); out.push(c); }
  return out;
}
function cardStr(c) { return RANKS[c >> 2] + SUITS[c & 3]; }
function comboStr(i) { return cardStr(COMBO_A[i]) + cardStr(COMBO_B[i]); }
function comboClass(i) {
  const a = COMBO_A[i], b = COMBO_B[i], ra = Math.max(a >> 2, b >> 2), rb = Math.min(a >> 2, b >> 2);
  if (ra === rb) return RANKS[ra] + RANKS[rb];
  return RANKS[ra] + RANKS[rb] + ((a & 3) === (b & 3) ? 's' : 'o');
}

// ---------------------------------------------------------------- evaluator
// returns category<<20 | kickers; higher is better
function topBits(mask, n) {
  let out = 0, m = mask, k = 0;
  while (k < n && m) { const r = 31 - Math.clz32(m); out = (out << 4) | r; m &= ~(1 << r); k++; }
  return out << (4 * (5 - n));
}
function straightHigh(mask) {
  const m = (mask << 1) | ((mask >> 12) & 1);
  const s = m & (m >> 1) & (m >> 2) & (m >> 3) & (m >> 4);
  return s ? (31 - Math.clz32(s)) + 3 : -1;
}
const _cnt = new Uint8Array(13), _sm = new Int32Array(4);
function evaluate(cards, n) {
  _cnt.fill(0); _sm.fill(0); let all = 0;
  for (let i = 0; i < n; i++) { const c = cards[i], r = c >> 2; _sm[c & 3] |= 1 << r; _cnt[r]++; all |= 1 << r; }
  for (let s = 0; s < 4; s++) {
    const sm = _sm[s];
    let bits = sm; bits = bits - ((bits >> 1) & 0x55555555); bits = (bits & 0x33333333) + ((bits >> 2) & 0x33333333);
    const pc = (((bits + (bits >> 4)) & 0x0F0F0F0F) * 0x01010101) >> 24;
    if (pc >= 5) { const h = straightHigh(sm); return h >= 0 ? (8 << 20) | (h << 16) : (5 << 20) | topBits(sm, 5); }
  }
  let quads = 0, trips = 0, pairs = 0, npairs = 0;
  for (let r = 0; r < 13; r++) { const c = _cnt[r]; if (c === 4) quads |= 1 << r; else if (c === 3) trips |= 1 << r; else if (c === 2) { pairs |= 1 << r; npairs++; } }
  if (quads) { const q = 31 - Math.clz32(quads); return (7 << 20) | (q << 16) | (topBits(all & ~(1 << q), 1) >> 12); }
  if (trips) {
    const t = 31 - Math.clz32(trips), rp = (pairs | trips) & ~(1 << t);
    if (rp) return (6 << 20) | (t << 16) | ((31 - Math.clz32(rp)) << 12);
  }
  const sh = straightHigh(all);
  if (sh >= 0) return (4 << 20) | (sh << 16);
  if (trips) { const t = 31 - Math.clz32(trips); return (3 << 20) | (t << 16) | (topBits(all & ~(1 << t), 2) >> 8); }
  if (npairs >= 2) {
    const p1 = 31 - Math.clz32(pairs), p2 = 31 - Math.clz32(pairs & ~(1 << p1));
    return (2 << 20) | (p1 << 16) | (p2 << 12) | (topBits(all & ~(1 << p1) & ~(1 << p2), 1) >> 8);
  }
  if (pairs) { const p = 31 - Math.clz32(pairs); return (1 << 20) | (p << 16) | (topBits(all & ~(1 << p), 3) >> 4); }
  return topBits(all, 5);
}

// ---------------------------------------------------------------- ranges
function classCombos(hi, lo, kind) {
  const v = [];
  for (let s1 = 0; s1 < 4; s1++) for (let s2 = 0; s2 < 4; s2++) {
    const a = hi * 4 + s1, b = lo * 4 + s2; if (a === b) continue;
    const ok = kind === 'p' ? (hi === lo && s1 < s2) : kind === 's' ? (hi !== lo && s1 === s2) : kind === 'o' ? (hi !== lo && s1 !== s2) : (hi !== lo || s1 < s2);
    if (ok) v.push(comboIndex(a, b));
  }
  return v;
}
function parseClass(t) {
  if (t.length < 2 || t.length > 3) throw new Error(`bad hand "${t}"`);
  const r1 = RANKS.indexOf(t[0].toUpperCase()), r2 = RANKS.indexOf(t[1].toUpperCase());
  if (r1 < 0 || r2 < 0) throw new Error(`bad hand "${t}"`);
  const hi = Math.max(r1, r2), lo = Math.min(r1, r2);
  let kind;
  if (hi === lo) { if (t.length === 3) throw new Error(`bad pair "${t}"`); kind = 'p'; }
  else if (t.length === 3) { kind = t[2].toLowerCase(); if (kind !== 's' && kind !== 'o') throw new Error(`bad hand "${t}"`); }
  else kind = 'a';
  return [hi, lo, kind];
}
function expandToken(t) {
  if (t.length === 4 && /^[2-9TJQKA][cdhs][2-9TJQKA][cdhs]$/i.test(t)) {
    const a = parseCard(t.slice(0, 2)), b = parseCard(t.slice(2)); if (a === b) throw new Error(`bad combo "${t}"`);
    return [comboIndex(a, b)];
  }
  const out = [];
  if (t.endsWith('+')) {
    const [hi, lo, kind] = parseClass(t.slice(0, -1));
    if (kind === 'p') for (let r = hi; r < 13; r++) out.push(...classCombos(r, r, 'p'));
    else for (let r = lo; r < hi; r++) out.push(...classCombos(hi, r, kind));
  } else if (t.includes('-')) {
    const [a, b] = t.split('-'); const [h1, l1, k1] = parseClass(a), [h2, l2, k2] = parseClass(b);
    if (k1 !== k2) throw new Error(`bad span "${t}"`);
    if (k1 === 'p') for (let r = Math.min(h1, h2); r <= Math.max(h1, h2); r++) out.push(...classCombos(r, r, 'p'));
    else { if (h1 !== h2) throw new Error(`span must keep its top card: "${t}"`); for (let r = Math.min(l1, l2); r <= Math.max(l1, l2); r++) out.push(...classCombos(h1, r, k1)); }
  } else { const [hi, lo, kind] = parseClass(t); out.push(...classCombos(hi, lo, kind)); }
  return out;
}
function parseRange(s) {
  const w = new Float32Array(NUM_COMBOS);
  for (const raw of s.split(',')) {
    const tok = raw.trim(); if (!tok) continue;
    let hand = tok, weight = 1;
    if (tok.includes(':')) { const [h, x] = tok.split(':'); hand = h.trim(); weight = parseFloat(x); if (!(weight >= 0 && weight <= 1)) throw new Error(`bad weight in "${tok}"`); }
    for (const c of expandToken(hand)) w[c] = weight;
  }
  return w;
}

// ---------------------------------------------------------------- tree

const K_ACTION = 0, K_CHANCE = 1, K_FOLD = 2, K_SHOW = 3;

}

function actionLabel(a) {
  const f = (x) => (Math.abs(x - Math.round(x)) < 1e-6 ? String(Math.round(x)) : x.toFixed(1));

// ---------------------------------------------------------------- ICM

// ---------------------------------------------------------------- abstraction

// ---------------------------------------------------------------- solver

  const box = $('inhand'); box.innerHTML = '';
  const st = preflop();
  if (!st.done) { box.innerHTML = '<span class="muted">Ranges appear once the preflop action is set.</span>'; return; }
  for (const s of postflopOrder()) {
    const w = Engine.parseRange(rangeFor(s)); let n = 0; for (const x of w) n += x;
    const d = document.createElement('span'); d.className = 'pchip';
    d.innerHTML = `<b>${s.pos}</b><span class="muted mono">${fmt(S.stack - s.put)}bb · ${(n / 13.26).toFixed(0)}%</span>`;
    const b = document.createElement('button'); b.textContent = S.overrides[s.pos] ? 'Range ✎' : 'Range'; b.onclick = () => openRange(s);
    d.appendChild(b); box.appendChild(d);
  }
}

// ---------------------------------------------------------------- range modal
const CLASS_N = (c) => (c.length === 2 ? 6 : c[2] === 's' ? 4 : 12);
function classAt(i, j) { const r1 = 12 - i, r2 = 12 - j; return i === j ? RANKS[r1] + RANKS[r2] : i < j ? RANKS[r1] + RANKS[r2] + 's' : RANKS[r2] + RANKS[r1] + 'o'; }
function classWeights(text) {
  const w = Engine.parseRange(text), acc = {};
  for (let c = 0; c < 1326; c++) { const k = Engine.comboClass(c); (acc[k] = acc[k] || [0, 0]); acc[k][0] += w[c]; acc[k][1]++; }
  const r = {}; for (const k in acc) r[k] = acc[k][0] / acc[k][1]; return r;
}
let rm = null;
function openRange(seat) {
  rm = { seat, weights: classWeights(rangeFor(seat)), painting: false, value: 1 };
  $('rmTitle').textContent = `${seat.pos} range`;
  const g = $('rmGrid'); g.innerHTML = '';
  for (let r = 0; r < 13; r++) for (let c = 0; c < 13; c++) { const k = classAt(r, c), d = document.createElement('div'); d.className = 'rcell'; d.dataset.k = k; d.innerHTML = `<div class="w"></div><span>${k}</span>`; g.appendChild(d); }
  drawRange(); $('rangeModal').hidden = false;
}
function drawRange() {
  let n = 0;
  $('rmGrid').querySelectorAll('.rcell').forEach((d) => { const w = rm.weights[d.dataset.k] || 0; n += w * CLASS_N(d.dataset.k); d.querySelector('.w').style.height = `${w * 100}%`; d.classList.toggle('on', w >= 0.5); });
  $('rmCount').textContent = `${n.toFixed(0)} combos · ${(n / 13.26).toFixed(1)}%`;
}
function paintAt(x, y) { const el = document.elementFromPoint(x, y)?.closest('.rcell'); if (el) { rm.weights[el.dataset.k] = rm.value; drawRange(); } }
$('rmGrid').addEventListener('pointerdown', (e) => { const el = e.target.closest('.rcell'); if (!el) return; const w = +$('rmWeight').value / 100, cur = rm.weights[el.dataset.k] || 0; rm.value = Math.abs(cur - w) < 1e-6 ? 0 : w; rm.painting = true; paintAt(e.clientX, e.clientY); });
window.addEventListener('pointermove', (e) => { if (rm && rm.painting) paintAt(e.clientX, e.clientY); });
window.addEventListener('pointerup', () => { if (rm) rm.painting = false; });
$('rmWeight').addEventListener('input', (e) => { $('rmWeightVal').textContent = `${e.target.value}%`; });
$('rmReset').onclick = () => { const o = S.overrides[rm.seat.pos]; delete S.overrides[rm.seat.pos]; rm.weights = classWeights(rangeFor(rm.seat)); if (o) S.overrides[rm.seat.pos] = o; rm.reset = true; drawRange(); };
$('rmClear').onclick = () => { rm.weights = {}; drawRange(); };
$('rmCancel').onclick = () => { $('rangeModal').hidden = true; rm = null; };
$('rmDone').onclick = () => {
  const parts = [];
  for (let r = 0; r < 13; r++) for (let c = 0; c < 13; c++) { const k = classAt(r, c), w = rm.weights[k] || 0; if (w > 0) parts.push(w >= 0.999 ? k : `${k}:${+w.toFixed(2)}`); }
  if (rm.reset && !parts.length) delete S.overrides[rm.seat.pos]; else S.overrides[rm.seat.pos] = parts.join(',');
  $('rangeModal').hidden = true; rm = null; renderInHand();
};
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('rangeModal').hidden) $('rmCancel').click(); });

// ---------------------------------------------------------------- solver worker
const worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
let solving = false, t0 = 0, secs = 60, built = null, path = [], selected = null, reqId = 0, report = null, evData = null, timer = null, lastIt = { t: 0, n: 0 }, rate = 0, spotGame = 'cash';
worker.onmessage = (ev) => {
  const m = ev.data;
  if (m.type === 'error') { $('err').textContent = m.message; if (m.reqId === undefined) endSolve(); return; }
  if (m.type === 'built') { built = m; path = []; selected = null; evData = null; renderEVs(); t0 = performance.now(); lastIt = { t: t0, n: 0 }; worker.postMessage({ cmd: 'solve', seconds: secs }); requestReport(); }
  if (m.type === 'progress') {
    const now = performance.now();
    if (now - lastIt.t > 900) { rate = (m.iters - lastIt.n) / ((now - lastIt.t) / 1000); lastIt = { t: now, n: m.iters }; }
    $('meter').style.width = `${Math.min(100, ((now - t0) / 1000 / secs) * 100)}%`;
    $('status').textContent = `${m.iters.toLocaleString()} hands dealt · ${Math.round(rate).toLocaleString()}/s · ${(m.bytes / 1e6).toFixed(m.bytes < 1e7 ? 1 : 0)} MB`;
    if (m.memoryCapped) $('err').textContent = 'Memory limit reached. Try Simple sizes.';
    if (m.done) { endSolve(); requestReport(); worker.postMessage({ cmd: 'ev', samples: 40000 }); }
  }
  if (m.type === 'report' && m.reqId === reqId) { report = m.report; renderNode(); }
  if (m.type === 'ev') { evData = m.ev; renderEVs(); }
};
function endSolve() { solving = false; $('solveBtn').hidden = false; $('stopBtn').hidden = true; $('meter').style.width = '100%'; clearInterval(timer); }
function startSolve(seconds) {
  $('err').textContent = '';
  let spot; try { spot = buildSpot(); Engine.makeSpot(spot); } catch (e) { $('err').textContent = e.message; return; }
  solving = true; secs = seconds || +$('depth').value; spotGame = S.game;
  $('solveBtn').hidden = true; $('stopBtn').hidden = false; $('meter').style.width = '0'; $('status').textContent = 'Building the game tree…';
  worker.postMessage({ cmd: 'build', spot });
  clearInterval(timer); timer = setInterval(() => { if (solving) requestReport(); }, 2500);
}
$('solveBtn').onclick = () => startSolve();
$('stopBtn').onclick = () => worker.postMessage({ cmd: 'stop' });
function requestReport() { if (!built) return; reqId++; worker.postMessage({ cmd: 'report', path, reqId }); }

// ---------------------------------------------------------------- strategy view
function colors(types) {
  const bets = types.map((t, i) => (t === 'bet' ? i : -1)).filter((i) => i >= 0), ramp = ['#e3a83f', '#e07a37', '#d24f3c', '#b13447'];
  return types.map((t, i) => t === 'fold' ? 'var(--a-fold)' : t === 'check' || t === 'call' ? 'var(--a-pass)' : t === 'allin' ? 'var(--a-allin)' : ramp[bets.length === 1 ? 1 : Math.round((bets.indexOf(i) / (bets.length - 1)) * 3)]);
}
function cardHTML(c) { const s = SUITS[c & 3]; return `<span class="crumb cardcrumb" style="color:${s === 'h' ? '#ee7a6b' : s === 'd' ? '#69a8e8' : s === 'c' ? '#6fc08a' : 'var(--fg)'}">${RANKS[c >> 2]}${SYM[s]}</span>`; }
function renderEVs() {
  const box = $('evs'); box.innerHTML = '';
  if (!evData || !built) return;
  evData.forEach((e, i) => { const d = document.createElement('div'); d.className = 'ev'; d.title = 'Expected value under the solved strategy';
    d.innerHTML = `${esc(built.names[i])} <b>${spotGame === 'icm' ? `${e.ev.toFixed(2)}%` : `${e.ev >= 0 ? '+' : ''}${e.ev.toFixed(2)} bb`}</b>`; box.appendChild(d); });
}
function renderCrumbs(r) {
  const box = $('crumbs'); box.innerHTML = '';
  if (!built) { box.hidden = true; return; } box.hidden = false;
  const root = document.createElement('button'); root.className = 'crumb'; root.textContent = 'Flop start'; root.onclick = () => { path = []; selected = null; requestReport(); }; box.appendChild(root);
  (r ? r.history : []).forEach((h, i) => {
    box.insertAdjacentHTML('beforeend', '<span class="arrow">›</span>');
    if (h.type === 'card') { box.insertAdjacentHTML('beforeend', cardHTML(h.card)); return; }
    const b = document.createElement('button'); b.className = 'crumb'; b.textContent = `${built.names[h.player]} ${h.label}`;
    b.onclick = () => { path = path.slice(0, i); selected = null; requestReport(); }; box.appendChild(b);
  });
}
function renderNode() {
  const r = report; renderCrumbs(r);
  const v = $('nodeView');
  if (!r) return;
  const boardStr = r.board.map(cardHTML).join(' ');
  if (r.kind === 'chance') {
    v.innerHTML = `<div class="node"><div class="nodetitle"><h2>Pick the ${r.street === 1 ? 'turn' : 'river'}</h2><span class="muted mono">pot ${fmt(r.pot)}</span> ${boardStr}</div><div class="picker" id="deal"></div></div>`;
    for (let s = 3; s >= 0; s--) for (let k = 12; k >= 0; k--) {
      const c = k * 4 + s, b = document.createElement('button'); b.className = `card s-${SUITS[s]}`; b.textContent = RANKS[k] + SYM[SUITS[s]]; b.disabled = r.board.includes(c);
      b.onclick = () => { path.push({ card: c }); requestReport(); }; $('deal').appendChild(b);
    }
    return;
  }
  if (r.kind === 'terminal') {
    const left = r.folded.map((f, i) => (f ? null : built.names[i])).filter(Boolean);
    v.innerHTML = `<div class="node"><div class="nodetitle"><h2>${left.length === 1 ? `${esc(left[0])} wins` : 'Showdown'}</h2><span class="muted mono">pot ${fmt(r.pot)}</span> ${boardStr}</div><div class="muted">End of the hand. Tap the trail above to go back.</div></div>`;
    return;
  }
  const col = colors(r.actionTypes), name = built.names[r.player];
  v.innerHTML = `<div class="node">
    <div class="nodetitle"><h2>${esc(name)}</h2><span class="muted mono">pot ${fmt(r.pot)}</span> ${boardStr}</div>
    <div class="actions">${r.actions.map((a, i) => `<button class="act" data-a="${i}"><i style="background:${col[i]}"></i><strong>${esc(a)}</strong><small>${(r.overall[i] * 100).toFixed(1)}%</small></button>`).join('')}</div>
    <div class="freqbar">${r.overall.map((f, i) => `<i style="width:${f * 100}%;background:${col[i]}"></i>`).join('')}</div>
    <div class="split"><div class="gridwrap"><div class="hgrid" id="hgrid"></div></div><div class="detail" id="detail"></div></div>
  </div>`;
  v.querySelectorAll('.act').forEach((b) => (b.onclick = () => { path.push({ a: +b.dataset.a }); selected = null; requestReport(); }));
  const g = $('hgrid');
  for (let i = 0; i < 13; i++) for (let j = 0; j < 13; j++) {
    const k = classAt(i, j), e = r.classes[k], cell = document.createElement('button');
    cell.className = 'cell' + (k === selected ? ' sel' : ''); cell.setAttribute('aria-label', k);
    const frac = e ? Math.min(1, e.w / CLASS_N(k)) : 0;
    if (e && e.w > 1e-9) cell.innerHTML = `<div class="mix">${e.s.map((f, a) => `<i style="width:${f * 100}%;background:${col[a]}"></i>`).join('')}</div><div class="fill" style="height:${(1 - frac) * 100}%"></div><span class="lab">${k}</span>`;
    else { cell.classList.add('none'); cell.innerHTML = `<span class="lab">${k}</span>`; }
    cell.onmouseenter = () => detail(k); cell.onfocus = () => detail(k);
    cell.onclick = () => { selected = selected === k ? null : k; g.querySelectorAll('.cell').forEach((c) => c.classList.toggle('sel', c.getAttribute('aria-label') === selected)); detail(k); };
    g.appendChild(cell);
  }
  g.onmouseleave = () => detail(selected);
  detail(selected);
}
function detail(k) {
  const r = report, d = $('detail'); if (!d || !r || r.kind !== 'action') return;
  const col = colors(r.actionTypes);
  if (!k || !r.classes[k] || r.classes[k].w <= 1e-9) {
    d.innerHTML = `<div class="label">${esc(built.names[r.player])}'s range here</div><div class="mono" style="font-size:22px">${r.totalReach.toFixed(1)} combos</div><div class="muted" style="font-size:12px">Hover or tap a hand for every combo.</div>`;
    return;
  }
  const e = r.classes[k];
  d.innerHTML = `<div class="row"><div class="grow"><div class="label">Hand</div><div class="mono" style="font-size:22px">${k}</div></div><span class="mono muted">${e.w.toFixed(2)} combos</span></div>
    <div class="freqbar">${e.s.map((f, a) => `<i style="width:${f * 100}%;background:${col[a]}"></i>`).join('')}</div>
    <div style="overflow-x:auto"><table><thead><tr><th>Combo</th>${r.actions.map((a, i) => `<th style="color:${col[i]}">${esc(a.replace('All-in', 'AI'))}</th>`).join('')}</tr></thead>
    <tbody><tr><td><b>All</b></td>${e.s.map((f) => `<td><b>${(f * 100).toFixed(0)}%</b></td>`).join('')}</tr>
    ${e.combos.filter((c) => c.reach > 1e-9).map((c) => `<tr><td>${c.name}</td>${c.s.map((f) => `<td>${(f * 100).toFixed(0)}%</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

// ---------------------------------------------------------------- controls
document.querySelectorAll('[data-game]').forEach((b) => (b.onclick = () => {
  S.game = b.dataset.game; document.querySelectorAll('[data-game]').forEach((x) => x.setAttribute('aria-pressed', x === b));
  $('leftWrap').hidden = S.game !== 'icm';
  fillStacks(); resetSeats();
}));
document.querySelectorAll('[data-table]').forEach((b) => (b.onclick = () => {
  S.table = +b.dataset.table; document.querySelectorAll('[data-table]').forEach((x) => x.setAttribute('aria-pressed', x === b)); resetSeats();
}));
function fillStacks() {
  const opts = S.game === 'cash' ? [40, 60, 100, 150, 200, 300] : [10, 15, 20, 25, 30, 40, 50, 60, 100];
  if (!opts.includes(S.stack)) S.stack = S.game === 'cash' ? 100 : 25;
  $('stack').innerHTML = opts.map((x) => `<option value="${x}" ${x === S.stack ? 'selected' : ''}>${x} bb</option>`).join('');
}
$('stack').onchange = (e) => { S.stack = +e.target.value; render(); };
$('left').innerHTML = [2, 3, 4, 5, 6, 7, 8, 9].map((x) => `<option ${x === 9 ? 'selected' : ''}>${x}</option>`).join('');
$('left').onchange = (e) => { S.left = +e.target.value; };
$('sizing').onchange = (e) => { S.sizing = e.target.value; applySizing(); };
$('randomFlop').onclick = () => { const d = []; while (d.length < 3) { const c = (Math.random() * 52) | 0; if (!d.includes(c)) d.push(c); } S.board = d; activeSlot = null; renderBoard(); };

// ---------------------------------------------------------------- start: CO opens, BTN and BB call on K84, quick solve
fillStacks(); applySizing(); resetSeats();
const script = [['fold'], ['fold'], ['fold'], ['fold'], ['fold'], ['open'], ['call'], ['fold'], ['call']];
for (const [k] of script) { const st = preflop(); if (st.done) break; const o = options(st.next, st).find((x) => x.k === k); act(st.next, o, st); }
S.board = Engine.parseCards('Kh8d4c'); renderBoard();
startSolve(10);
})();
</script>
